name: Build and Deploy

on: push

env:
  HUGO_VERSION: 0.165.0

jobs:
  stagingbuild:
    name: Staging Build and Deploy
    runs-on: ubuntu-latest
    if: github.ref_name == 'staging'
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install Hugo
        run: |
          set -euo pipefail
          archive="hugo_extended_withdeploy_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${archive}"
          curl -fsSL -o checksums.txt "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_checksums.txt"
          expected=$(awk -v f="$archive" '$2 == f || $2 == "*"f { print $1; found=1 } END { exit !found }' checksums.txt)
          actual=$(sha256sum "$archive" | awk '{ print $1 }')
          test "$expected" = "$actual"
          sudo tar -xzf "$archive" -C /usr/local/bin hugo
          hugo version
      - name: Hugo Build
        run: hugo --baseURL "https://staging.doi.org/"
      - name: Refuse a thin build
        run: |
          count=$(find public -type f | wc -l | tr -d ' ')
          test "$count" -ge 1500 || { echo "public/ has $count files, expected >= 1500"; exit 1; }
      - name: Deploy to S3
        run: hugo deploy --target=s3_staging --maxDeletes 256
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  livebuild:
    name: Live Build and Deploy
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install Hugo
        run: |
          set -euo pipefail
          archive="hugo_extended_withdeploy_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${archive}"
          curl -fsSL -o checksums.txt "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_checksums.txt"
          expected=$(awk -v f="$archive" '$2 == f || $2 == "*"f { print $1; found=1 } END { exit !found }' checksums.txt)
          actual=$(sha256sum "$archive" | awk '{ print $1 }')
          test "$expected" = "$actual"
          sudo tar -xzf "$archive" -C /usr/local/bin hugo
          hugo version
      - name: Hugo Build
        run: hugo --baseURL "https://www.doi.org/"
      - name: Refuse a thin build
        run: |
          count=$(find public -type f | wc -l | tr -d ' ')
          test "$count" -ge 1500 || { echo "public/ has $count files, expected >= 1500"; exit 1; }
      - name: Deploy to S3
        run: hugo deploy --target=s3_live --maxDeletes 256
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # Cloudflare's origin is CloudFront, so CloudFront has to finish
      # invalidating first or Cloudflare would re-cache the old pages.
      - name: Invalidate CloudFront
        run: |
          set -euo pipefail
          id=$(aws cloudfront create-invalidation --distribution-id E27D2XMN04P68J \
                --paths '/*' --query Invalidation.Id --output text)
          echo "Invalidation $id"
          aws cloudfront wait invalidation-completed --distribution-id E27D2XMN04P68J --id "$id"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
      - name: Purge Cloudflare
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"hosts":["www.doi.org"]}' \
          | jq -e '.success'
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
